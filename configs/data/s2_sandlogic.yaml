name: s2_sandlogic
source_id: S2
hf_repo: SandLogicTechnologies/Indic_Chat_Dataset
split: marathi
license: Apache-2.0
origin: Curated Indic multi-turn and single-turn chat
sample_limit: 100000 # cap stream before filtering for bounded RAM on 14 GB host
clean:
  min_devanagari_purity: 60.0
  max_seq_len: 768
  min_response_chars: 10
  max_repeat_ngram_frac: 0.25
  max_latin_ratio: 0.15
  require_mr_lang_id: true
dedup:
  minhash_threshold: 0.8
  ngram_size: 5
budget:
  train_samples: 12000
  dev_samples: 500
  seed: 42

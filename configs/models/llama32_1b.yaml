name: llama32_1b
hf_id: unsloth/Llama-3.2-1B-Instruct-bnb-4bit
max_seq_len: 768
prequantized: true
load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear
train:
  lr: 2.0e-4
  epochs: 1
  per_device_batch: 2
  grad_accum: 4          # effective batch 8
  gradient_checkpointing: unsloth
  response_only_loss: true
  seed: 0
  save_steps: 250

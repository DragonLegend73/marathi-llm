name: sarvam1
hf_id: sarvamai/sarvam-1
max_seq_len: 768
prequantized: false
load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear
train:
  lr: 2.0e-4
  epochs: 1
  per_device_batch: 1
  grad_accum: 8          # effective batch 8 (tighter VRAM for 2B model)
  gradient_checkpointing: unsloth
  response_only_loss: true
  seed: 0
  save_steps: 250

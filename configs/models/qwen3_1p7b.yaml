name: qwen3_1p7b
hf_id: unsloth/Qwen3-1.7B-unsloth-bnb-4bit
max_seq_len: 768
prequantized: true
load_in_4bit: true
enable_thinking: false
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear
train:
  lr: 2.0e-4
  epochs: 1
  per_device_batch: 2
  grad_accum: 4          # effective batch 8
  gradient_checkpointing: unsloth
  response_only_loss: true
  seed: 0
  save_steps: 250
